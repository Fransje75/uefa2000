<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>UEFA Manager 2000 — web</title>
<style>
:root{
  --turf:#1F4D3A; --turf-2:#173B2C; --chalk:#F3F5F0; --ink:#17201B; --amber:#FFB627; --muted:#6B7A71; --line:#D9DED7; --win:#2E8B57; --loss:#B5403A; --draw:#8A8F86;
  --display: Bahnschrift, "DIN Alternate", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--chalk);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* scorebord */
.board{background:var(--turf);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;position:sticky;top:0;z-index:5;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 38px,transparent 38px 76px)}
.board .club{font:600 15px/1.2 var(--body);opacity:.85;display:flex;justify-content:space-between;gap:12px}
.board .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.led{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--amber);font-size:min(44px,10.5vw);white-space:nowrap;line-height:1;letter-spacing:.02em;
  text-shadow:0 0 14px rgba(255,182,39,.35)}
.led small{font-size:18px;color:rgba(255,182,39,.8);margin-left:6px}
.board .side{text-align:right;font:500 14px/1.3 var(--body);opacity:.9}
.board .side b{font:600 26px/1 var(--display);color:#fff;display:block}
.board.busy .led{animation:flick 1s steps(2) infinite}
@keyframes flick{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.board.busy .led{animation:none}}

main{padding:4px 0 calc(150px + var(--safe-b))}
section h2{font:600 22px/1.2 var(--display);margin:22px 18px 8px;letter-spacing:.01em}
.list{margin:0;padding:0;list-style:none;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);min-height:48px}
.list li:first-child{border-top:0}
.list li.tap{cursor:pointer}
.list li.tap:active{background:#EEF2EC}
.list .grow{flex:1;min-width:0}
.list .sub{color:var(--muted);font-size:13px}
.list .end{text-align:right;white-space:nowrap;flex:none}
.score{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.res{width:8px;align-self:stretch;border-radius:2px}
.sub.cupnote{color:var(--ink);font-weight:600}
.res.W{background:var(--win)}.res.V{background:var(--loss)}.res.G{background:var(--draw)}
.empty{padding:16px 18px;color:var(--muted)}
.me{background:#FFF7E2 !important;font-weight:600}

table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.tbl th{font:500 12px/1 var(--body);color:var(--muted);text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;font-size:16px}
.tbl td.n,.tbl th.n{text-align:left;font-family:var(--body);font-size:14px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td:first-child,.tbl th:first-child{padding-left:18px;color:var(--muted)}
.tbl td:last-child,.tbl th:last-child{padding-right:18px;font-weight:700}
.tbl tr.zone td:first-child{box-shadow:inset 4px 0 var(--turf)}

/* doorgaan + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--chalk);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.go{display:block;width:calc(100% - 24px);margin:10px 12px 8px;border:0;border-radius:14px;background:var(--amber);color:#2B1D00;
  font:700 20px/1 var(--display);padding:16px;letter-spacing:.02em;cursor:pointer}
.go:disabled{opacity:.6}
.go small{display:block;font:500 13px/1.3 var(--body);margin-top:4px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;font:500 12px/1.2 var(--body);color:var(--muted);cursor:pointer}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--turf);font-weight:700}

/* algemene schermen */
.screen{max-width:640px;margin:0 auto}
.intro{padding:28px 20px}
.intro h1{font:700 40px/1.05 var(--display);margin:0 0 10px;color:var(--turf)}
.intro p{max-width:60ch;color:#34413A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:600;cursor:pointer;background:var(--turf);color:#fff;min-height:48px}
.btn.alt{background:#fff;color:var(--turf);box-shadow:inset 0 0 0 2px var(--turf)}
.btn.wide{width:100%}
.stack{display:grid;gap:10px;margin-top:18px}
input[type=text]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus{border-color:var(--turf);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--turf);border-color:var(--turf);color:#fff}
.note{font-size:13px;color:var(--muted);padding:0 18px}
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;margin:0 18px;padding:6px;background:#2a5d47;border-radius:10px}
.hgrid .fld{grid-column:2/14;grid-row:2/11;border:2px solid rgba(255,255,255,.7);border-radius:3px;margin:3px;position:relative;background:repeating-linear-gradient(90deg,#2f6a50 0 12%,#326f54 12% 24%)}
.hgrid .fld::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.6)}
.hgrid .fld::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.6);border-radius:50%}
.hs{min-width:0;min-height:26px;padding:0;border:0;border-radius:4px;font:700 11px/26px var(--body);background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.hs.on{background:#F3F5F0;color:var(--ink)}
.hs.lock{background:#FFB627;color:var(--ink)}
.hs.low{background:#F7C9C5;color:#7a1f19}
.hs.pick{outline:2px solid #FFB627;outline-offset:-2px}
.hlegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 18px 0;font-size:12px;color:var(--muted)}
.hlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
li.sel{background:#FFF7E2}
.err{color:var(--loss);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--turf);width:0}

/* spelerskaart (sheet) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:flex;align-items:flex-end}
.sheet>div{background:var(--chalk);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 0 calc(24px + var(--safe-b))}
.sheet h3{font:700 28px/1.1 var(--display);margin:0 18px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 22px;padding:6px 18px}
.attr{display:grid;grid-template-columns:minmax(0,1fr) 48px 26px;align-items:center;gap:8px;font-size:14px}
.attr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attr meter{width:48px;height:8px}
.attr b{font-family:var(--display);text-align:right;font-size:16px}
.pos{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:700 13px/1 var(--display);color:#fff;flex:none}
.pos.p0{background:#C98A00}.pos.p1{background:#2F5D8A}.pos.p2{background:var(--turf)}.pos.p3{background:#9C3B2E}
.toast{position:fixed;left:12px;right:12px;bottom:calc(140px + var(--safe-b));background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:30}
.tabs button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:#2B1D00;font:700 11px/18px var(--body);font-style:normal}
.list li.mail .t{font-weight:500}
.list li.mail.unread .t{font-weight:700}
.list li.mail::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;margin-left:-4px}
.list li.mail.unread::before{background:var(--amber)}
h2 .count{font:600 13px/1 var(--body);color:var(--muted);margin-left:6px}
.tbl td.form{white-space:nowrap}
.tbl td.form .res{display:inline-block;width:12px;height:16px;margin-right:3px;vertical-align:middle;align-self:auto}
.list li.mine{background:color-mix(in srgb,var(--amber) 14%,transparent)}
.ord{list-style:none;margin:12px 18px 0;padding:0;display:grid;gap:6px}.ord li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px}.ord label{font-size:15px}.ord output{font:600 15px var(--mono,monospace);min-width:3ch;text-align:right}.ord input{grid-column:1/-1;width:100%;min-height:32px;accent-color:var(--turf)}
.deal label.chk,.chk{display:flex;align-items:center;gap:10px;font-size:16px;min-height:40px;color:var(--ink)}.chk input{width:22px;height:22px}
.sheet .chips{flex-wrap:wrap;padding:12px 18px 0}
.sheet .body{white-space:pre-line;font-size:16px;line-height:1.55;margin:10px 18px 0}
.paper{margin:12px 12px 0;background:#fff;border-radius:12px;padding:4px 18px}
.paper article{padding:16px 0;border-bottom:1px solid var(--line)}
.paper article:last-child{border-bottom:0}
.paper h3{font:700 21px/1.15 var(--display);margin:4px 0 6px;letter-spacing:-.005em}
.paper p{margin:0;font-size:15px;line-height:1.5;color:#34413A}
.paper .dl{font-size:12px;color:var(--muted)}
.paper article.unread h3::after{content:"nieuw";font:600 11px/1 var(--body);color:#2B1D00;background:var(--amber);border-radius:6px;padding:3px 6px;margin-left:8px;vertical-align:3px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg.four{grid-template-columns:repeat(4,1fr)}.seg.four button{padding:10px 2px;font-size:14px}
.wk{width:calc(100% - 24px);margin:4px 12px 0;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.wk th{font:600 12px/1.2 var(--body);color:var(--muted);padding:2px 0}.wk th.d{width:30px;text-align:left;font-size:13px;color:var(--ink)}
.wk td{padding:0}.wk button{width:100%;height:38px;border:0;border-radius:7px;font:700 12px/1 var(--body);cursor:pointer;color:#fff;padding:0}
.wk button:disabled{cursor:default;opacity:.85}
.dr0,.dr1,.dr2{background:#B7791F}.dr3,.dr5{background:#2E8B57}.dr4{background:#2F6690}.dr6,.dr7,.dr8{background:var(--turf)}.dr9{background:#7A5C8E}
.dr10{background:#E4E9E2!important;color:var(--muted)!important}.dr11{background:#fff!important;color:var(--turf)!important;box-shadow:inset 0 0 0 2px var(--turf)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 18px 0;font-size:13px;color:#34413A}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.drills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.drills button{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:600 14px/1.2 var(--body);cursor:pointer}
.drills button[aria-pressed=true]{border-color:var(--turf);background:#EAF1EC}.drills i{flex:none;width:26px;height:26px;border-radius:6px}
.split{list-style:none;margin:12px 0 0;padding:0}.split li{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--line)}.split li span{flex:1}.split small{font-size:13px;color:var(--muted)}
.split button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 20px/1 var(--body);cursor:pointer}.split b{width:48px;text-align:center;font:600 18px var(--display);font-variant-numeric:tabular-nums}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.row-btns{display:flex;gap:8px;margin-top:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:0 18px 12px}
.filters .full{grid-column:1/-1}
.filters label,.deal label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
select,input[inputmode=numeric]{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
select:focus,input[inputmode=numeric]:focus{border-color:var(--turf);outline:none}
.deal{display:grid;gap:10px;margin:14px 18px 0;padding:14px;background:#fff;border-radius:12px}.terms{border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 0}.terms summary{font-weight:600;cursor:pointer;padding:6px 0;min-height:32px}.terms .tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.terms .tgrid label{font-size:13px;display:flex;flex-direction:column;justify-content:flex-end}
.deal{grid-template-columns:minmax(0,1fr)}.deal select{width:100%;min-width:0;box-sizing:border-box}.deal .split{margin:0}.deal .split li{padding:8px 0}.deal .list li{padding-left:0;padding-right:0}
.deal .st,.sub.st-clubJa,.sub.st-spelerNee,.sub.st-clubNee{font-weight:600;color:var(--ink)}
.st-clubJa{color:var(--win)!important}.st-clubNee,.st-spelerNee{color:var(--loss)!important}.st-rond{color:var(--win)!important;font-weight:600}
.topbar{padding:10px 12px 0}
.back{border:0;background:none;color:var(--turf);font-weight:600;font-size:16px;padding:10px 6px;cursor:pointer}
.balance{padding:6px 18px 4px}
.balance .big{font:700 clamp(36px,11vw,52px)/1.05 var(--display);margin:4px 0 6px;font-variant-numeric:tabular-nums}
.num.neg,.big.neg{color:var(--loss)}.num.plus{color:var(--win)}
.list li.fin.d1{padding-left:34px;background:#FAFBF8}.list li.fin.d2{padding-left:50px;background:#FAFBF8}
.chev{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.list li.fin[aria-expanded=true] .chev{transform:rotate(90deg)}
/* opstelling */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:16px 18px 4px;background:#E4E9E2;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbl{font:500 13px/1.2 var(--body);color:var(--muted);margin:14px 18px 0}
.pitch{position:relative;margin:8px 12px 0;aspect-ratio:68/88;max-height:68vh;background:var(--turf);border-radius:12px;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 11.1%,transparent 11.1% 22.2%)}
.pitch .ln{position:absolute;border:2px solid rgba(243,245,240,.5);pointer-events:none}
.pitch .half{left:-2px;right:-2px;top:50%;height:0;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{left:22%;right:22%;height:15%;border-top-width:2px}.pitch .box.t{top:-2px}.pitch .box.b{bottom:-2px}
.pitch .zone{position:absolute;border:1px dashed rgba(255,255,255,.35);display:grid;place-items:start;padding:3px 4px;font:600 11px/1 var(--display);color:rgba(255,255,255,.55);letter-spacing:.04em;pointer-events:none}
.pitch.edit{outline:3px solid var(--amber);outline-offset:-3px;cursor:crosshair}
.slot{position:absolute;transform:translate(-50%,-50%);width:76px;display:grid;justify-items:center;gap:3px;border:0;background:none;padding:2px;cursor:pointer;color:#fff}
.slot .dot{width:40px;height:40px;border-radius:50%;background:var(--chalk);color:var(--ink);display:grid;place-items:center;font:700 18px/1 var(--display);
  box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.slot .nm{font:600 12px/1.15 var(--body);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.slot .rl{font:500 11px/1 var(--display);opacity:.75;letter-spacing:.04em}
.slot.off .dot{box-shadow:0 0 0 3px var(--loss),0 2px 0 rgba(0,0,0,.25)}
.slot.sel .dot,.list li.sel .no{background:var(--amber);color:#2B1D00}
.slot .warn,.list .warn{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--loss);color:#fff;font:700 11px/18px var(--body);padding:0 4px}
.list .warn{position:static;display:inline-block;margin-left:6px;vertical-align:1px}
.no{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#E4E9E2;font:700 15px/1 var(--display);flex:none}
.rolechip{font:600 12px/1 var(--display);color:var(--muted);min-width:34px}
.hint{position:fixed;left:12px;right:12px;bottom:calc(150px + var(--safe-b));z-index:7;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.hint button{margin-left:auto;border:0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.alert{margin:12px 12px 0;border-left:4px solid var(--loss);background:#fff;padding:10px 14px;font-size:14px;border-radius:0 10px 10px 0}
.fitline{display:flex;justify-content:space-between;gap:10px;margin:8px 18px 0;font-size:13px;color:var(--muted)}
@media (min-width:760px){ main{max-width:720px;margin:0 auto} .board .inner{max-width:720px;margin:0 auto} .dock .inner{max-width:720px;margin:0 auto} }

/* ---- landscape frame (start screens; later all screens). Scales with viewport height. ---- */
.fr{--side:clamp(176px,29vh,300px);font-size:clamp(13px,2.45vh,19px);display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--turf-2)}
.fr-side{display:flex;flex-direction:column;gap:1.4vh;padding:2.2vh 1.6vh;background:linear-gradient(180deg,#245a44,#1a4232);color:#fff;min-height:0;
  background-image:linear-gradient(180deg,#245a44,#1a4232),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 18px,transparent 18px 36px);background-blend-mode:normal}
.fr-logo{display:grid;justify-items:center;line-height:1;padding:.2em 0 .1em}
.fr-logo .a{font:700 1.15em/1 var(--display);letter-spacing:.32em;color:var(--amber);padding-left:.32em}
.fr-logo .b{font:700 1.55em/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase}
.fr-logo .c{font:500 .95em/1 var(--display);letter-spacing:.55em;opacity:.85;padding-left:.55em}
.fr-info{min-height:4.6em;border-radius:.6em;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);padding:.55em .7em;display:grid;align-content:center;gap:.1em;font-size:.86em}
.fr-info .k{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.fr-info b{font:600 1.15em/1.15 var(--display)}
.fr-menu{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:max(.45em,1vh)}
.fr-btn{border:0;border-radius:.55em;min-height:max(2.6em,40px);padding:.35em .6em;background:rgba(255,255,255,.12);color:#fff;font:600 .95em/1.15 var(--body);cursor:pointer;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.fr-btn:hover{background:rgba(255,255,255,.2)}
.fr-btn[aria-current=page]{background:var(--chalk);color:var(--turf)}
.fr-btn[aria-disabled=true]{opacity:.38;cursor:default;background:rgba(255,255,255,.06)}
.fr-tools{display:flex;gap:.5em;align-items:stretch}
.fr-ico,.fr-go{border:0;border-radius:.55em;min-height:max(2.7em,42px);min-width:max(2.7em,42px);display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.fr-ico svg,.fr-go svg{width:1.35em;height:1.35em}

.gsheet form.ig{display:grid;grid-template-columns:auto 1fr;gap:.45em .8em;align-items:center;margin:10px 18px}

/* Football Today */
.ft{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:1.4vh;padding:1.4vh;height:100%;min-height:330px;box-sizing:border-box}

.fc{padding:0 0 .5em;display:flex;flex-direction:column;min-height:0}
.fc-hd{display:flex;align-items:center;gap:.4em;padding:.35em .4em;background:var(--turf);color:#fff;border-radius:.55em .55em 0 0}

.fc-nav{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:.35em;width:2em;height:1.8em;display:grid;place-items:center;cursor:pointer}

.fc-d.has{color:#0E8A3E;font-weight:800;background:#E3F5E8}

.ft-r{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1.4vh;min-width:0;min-height:0}
.fs,.fm{display:flex;flex-direction:column;min-height:0}

.fs-r{width:100%;display:flex;align-items:center;gap:.5em;border:0;background:none;text-align:left;padding:.22em .6em;font:inherit;font-size:.9em;cursor:default;color:var(--ink)}

.fs-r.tap{cursor:pointer}.fs-r.tap:hover{background:#F2F5F0}
.fs-none{padding:.5em .7em;color:var(--muted);font-size:.9em}
.fm-hd,.fm-r{display:grid;grid-template-columns:1fr 4em 4.5em;gap:.4em;padding:.2em .6em}
.fm-hd{font-size:.75em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.fm-hd span:not(:first-child),.fm-r span:not(:first-child){text-align:right}
.fm-r{width:100%;border:0;background:none;font:inherit;font-size:.9em;text-align:left;cursor:pointer;color:var(--ink)}
.fm-r:hover{background:#F2F5F0}
.fg{padding:.5em .5em .45em;display:flex;flex-direction:column;gap:.5em;min-height:0}
.fg-wrap{display:flex;flex-direction:column;gap:.6vh;min-height:0}.fg-wrap .fg{flex:1}
.ft-mf{display:flex;justify-content:flex-end}
.gsvg{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(80,110,160,.08) 11px 12px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(80,110,160,.08) 11px 12px),#F3F5F8;border-radius:.4em}
.gsvg svg{position:absolute;inset:0;display:block}
.gsvg .nod{position:absolute;inset:0;display:grid;place-items:center;color:#444;font-size:1.05em}
.gbox{fill:none;stroke:#556;stroke-width:1}
.ggrid{stroke:rgba(60,80,120,.18);stroke-width:1}
.gx,.gy{fill:#2A3340;font-family:var(--body)}.gy{text-anchor:end}.gy.r{text-anchor:start}.gx{text-anchor:middle}.gy.cp{fill:#C0312A}.gy.ct{fill:#2F5BD6}
.g0{stroke:#999;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.gsvg polyline{fill:none;stroke-width:2.2}
.gsvg .pt{stroke:none}
.lp{stroke:#E0443A}.lp.pt{fill:#E0443A}.lt{stroke:#2F5BD6}.lt.pt{fill:#2F5BD6}
.lb{stroke:#2F5BD6}.lb.pt{fill:#2F5BD6}.lo{stroke:#F08A3C}.lo.pt{fill:#F08A3C}
.fg-b{display:flex;gap:.4em;flex-wrap:wrap}.fg-b .sp{flex:1}
.fgb{border:0;border-radius:.4em;padding:.4em .8em;min-height:max(2em,30px);font:600 .82em var(--body);color:#fff;cursor:pointer;opacity:.45}

.fgb.red{background:#D2362E}.fgb.blue{background:#2F5BD6}.fgb.orange{background:#E8822E}
.ft-wait{padding:2em;color:var(--muted)}
/* Team Selection */
.ts{--tsrow:clamp(22px,3.7vh,28px);display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:1.2vh;padding:1.2vh;height:100%;box-sizing:border-box}

.ts-sel{display:flex;align-items:center;gap:.45em}

.ts-sel select{width:auto;min-width:8em;font-size:.95em;padding:.3em .6em;min-height:max(2em,30px);border-radius:.45em;border:1.5px solid var(--line)}

.ts-sec{background:#fff;border:1px solid var(--line);border-radius:.55em;overflow:hidden;flex:none}
.ts-sec h3{margin:0;padding:.35em .7em;font:600 .78em/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:#fff;background:var(--turf)}
.ts-row{display:grid;grid-template-columns:5px 1.9em minmax(0,1fr) 1.7em 2.6em 2.1em;align-items:center;gap:.4em;padding-right:.55em;height:var(--tsrow);border-top:1px solid #EDF0EB;font-size:clamp(9px,calc(var(--tsrow) * .6),15px);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;background:#fff;box-sizing:border-box}

.ts-row.ts-h{height:auto;padding-top:.2em;padding-bottom:.2em;font-size:clamp(9px,calc(var(--tsrow) * .44),12px);font-weight:600;color:var(--muted);background:#F2F5F0;cursor:default;border-top:0}
.ts-row.empty{cursor:default}
.ts-row{overflow:hidden}
.ts-row .ci-ec,.ts-ghost .ci-ec{width:.95em;height:1.14em;background-size:15.2em 1.14em;animation:tsec 1.6s steps(16) infinite}
@keyframes tsec{to{background-position:-15.2em 0}}
.ts-row.sel{background:#11335A;color:#FFD54A}.ts-row.sel .ts-no{color:#FFD54A}
.ts-bar{align-self:stretch;display:block}
.ts-bar.b0{background:#52CE29}.ts-bar.b1{background:#FFCE00}.ts-bar.b2{background:#296BDE}.ts-bar.b3{background:#FF4A63}
.ts-no{text-align:right;color:var(--muted)}
.ts-nm{display:flex;align-items:center;gap:.3em;min-width:0}
.ts-nm>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-nm .flag{width:1.45em;height:auto;flex:none}
.ts-ic{width:1.05em;height:1.05em;flex:none}
.ts-c{display:grid;place-items:center}.ts-n{text-align:right}
.ts-row .ci-pos{width:1.35em;height:1.35em;font-size:.72em}
.ts-row .ci-role{width:2.3em;height:1.15em}
.ts-side{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1vh;min-height:0;min-width:0}
.ts-pw{min-height:0;min-width:0;display:grid;place-items:center;container-type:size}
.ts-pitch{position:relative;width:min(100cqw,calc(100cqh * 4 / 3));aspect-ratio:4/3;container-type:inline-size;border-radius:.4em;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  background:repeating-linear-gradient(90deg,#3F8F3A 0 6.25%,#4A9B43 6.25% 12.5%)}
.ts-pitch svg{position:absolute;inset:0;width:100%;height:100%}
.ts-pitch .pl{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.4;vector-effect:non-scaling-stroke}
.ts-pitch .pz{fill:none;stroke:#E8D84A;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.8}
.ts-dot{position:absolute;transform:translate(-50%,-50%);width:7cqw;height:7cqw;border-radius:50%;display:grid;place-items:center;font:700 3.4cqw/1 var(--display);color:#1A1A1A;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.35)}
.ts-mk{position:absolute;transform:translate(-50%,-50%);width:11cqw;height:11cqw;pointer-events:none;background:linear-gradient(#FFD54A,#FFD54A) 0 0/32% 2px no-repeat,linear-gradient(#FFD54A,#FFD54A) 0 0/2px 32% no-repeat,linear-gradient(#FFD54A,#FFD54A) 0 100%/32% 2px no-repeat,linear-gradient(#FFD54A,#FFD54A) 0 100%/2px 32% no-repeat,linear-gradient(#FFD54A,#FFD54A) 100% 0/32% 2px no-repeat,linear-gradient(#FFD54A,#FFD54A) 100% 0/2px 32% no-repeat,linear-gradient(#FFD54A,#FFD54A) 100% 100%/32% 2px no-repeat,linear-gradient(#FFD54A,#FFD54A) 100% 100%/2px 32% no-repeat}
.ts-dot.p0{background:#52CE29}.ts-dot.p1{background:#FFCE00}.ts-dot.p2{background:#296BDE;color:#fff}.ts-dot.p3{background:#FF4A63}
.ts-btns{display:flex;gap:.45em;justify-content:flex-end;flex-wrap:wrap}
.ts-top .ts-btns{margin-left:auto}
.fgb.tsb{opacity:1;min-height:max(2.2em,32px);padding:.4em 1em}.fgb.green{background:#2E8B57}
.fgb.tsb[aria-pressed=true]{box-shadow:inset 0 0 0 2px #fff;background:#A3211B}.fgb.tsb[aria-disabled=true]{opacity:.35;cursor:default}
.ts-ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;border:1.5px solid var(--turf);border-radius:.4em;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:.96;font-size:clamp(12px,2.25vh,17px)}
.ts-src{opacity:.35}
.ts-row.ts-over{background:#FFF1CF;box-shadow:inset 0 0 0 2px var(--amber)}
@media (max-height:500px){
  .gf{--side:clamp(170px,26vw,220px);font-size:12px}
  .gf-logo{display:none}
  .gn-grid{grid-template-columns:repeat(10,1fr);gap:2px;padding:2px}

  .ts-sel select{min-height:26px;padding:.15em .5em}.fgb.tsb{min-height:26px;padding:.25em .8em}
  .ft{gap:6px;padding:6px}.ft-r{gap:6px}.fg{gap:4px;padding:4px}.fgb{min-height:24px;padding:.25em .7em}.ft h3{padding:.35em .6em}.fc-hd{padding:.2em .4em}.fc-nav{height:1.5em}

.md-t{display:grid}
.md-r{display:grid;grid-template-columns:5px minmax(0,1fr) 1.7em 2.6em 2.4em;align-items:center;gap:.4em;padding-right:.5em;min-height:1.75em;border-top:1px solid #EDF0EB;font-size:.88em}
.md-r.md-h{min-height:0;padding-top:.25em;padding-bottom:.25em;font-size:.72em;font-weight:600;color:var(--muted);background:#F2F5F0;border-top:0}

.md-ic{width:1.1em;height:1.1em;flex:none}

const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const fmtDate = (d) => d ? `${d[0]} ${MONTHS[d[1] - 1]} ${d[2]}` : '';
const money = (n) => n < 0 ? '−' + money(-n) : n >= 1e6 ? `£${(n / 1e6).toLocaleString('nl-NL', { maximumFractionDigits: 2 })} mln` : n >= 1e3 ? `£${Math.round(n / 1e3)}k` : `£${n}`;
const POS = ['K', 'V', 'M', 'A'];
const ATTR_NL = ['Keepen', 'Tackelen', 'Passen', 'Dribbelen', 'Koppen', 'Schieten', 'Kracht', 'Snelheid', 'Fitheid', 'Moraal', 'Behendigheid', 'Agressie', 'Zelfvertrouwen', 'Empathie', 'Hebzucht', 'Intelligentie', 'Wilskracht', 'Invloed', 'Blessuregevoelig', 'Dekken', 'Potentieel', 'Beoordeling'];
const KEY_ATTRS = [[0, 10, 17], [1, 19, 4, 6], [2, 3, 15, 8], [5, 7, 4, 3]];
const overall = (p) => Math.round(KEY_ATTRS[p.pos].reduce((s, k) => s + p.attrs[k], 0) / KEY_ATTRS[p.pos].length);

let worker, seq = 0; const pending = new Map();
function startWorker() {
  try {
    const url = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }));
    worker = new Worker(url);
  } catch (e) {
    // terugval: engine in de hoofdthread (de pagina reageert dan niet tijdens het doorspelen)
    S.mainThread = true;
    const inner = { postMessage: (m) => worker.onmessage({ data: m }) };
    new Function('self', WORKER_SOURCE)(inner);
    worker = { postMessage: (msg) => setTimeout(() => inner.onmessage({ data: msg }), 30) };
  }
  worker.onmessage = (e) => { const m = e.data; const p = pending.get(m.id); if (!p) return;
    if (m.progress && p.onProgress) p.onProgress(m.progress);
    if (m.done) { pending.delete(m.id); if (m.error) { const er = new Error(m.error); er.diag = m.diag; p.reject(er); } else p.resolve(m.res); } };
  worker.onerror = (e) => { for (const p of pending.values()) p.reject(new Error(e.message || 'Fout in de spelengine')); pending.clear(); };
}
function rpc(cmd, args, onProgress, transfer) {
  return new Promise((resolve, reject) => { const id = ++seq; pending.set(id, { resolve, reject, onProgress }); worker.postMessage({ id, cmd, args }, transfer || []); });
}

// ------------------------------------------------------------ opslag (IndexedDB)
const DB_NAME = 'uefa2000web';
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('saves'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function dbOp(store, mode, fn) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); }
const dbGet = (s, k) => dbOp(s, 'readonly', (st) => st.get(k));
const dbPut = (s, k, v) => dbOp(s, 'readwrite', (st) => st.put(v, k));
const dbDel = (s, k) => dbOp(s, 'readwrite', (st) => st.delete(k));

const NEEDED = /(^|\/)(uefa2000b\.exe|gfx\/main\.bfs|data\/(data\.bin|names\/.*|tables\/.*|tactics\/.*|training\/.*|configs\/.*)|scripts\/.*|controlsscripts\/.*|tabletextscript\/.*|textdescriptionscript\/.*|help\/english\/\d+\.txt)$/i;
function normalize(paths) {
  // zoek de map waarin UEFA2000b.exe staat en maak alle paden daaraan relatief
  const exe = paths.find((p) => /(^|\/)uefa2000b\.exe$/i.test(p));
  if (!exe) return null;
  const root = exe.slice(0, exe.length - 'uefa2000b.exe'.length);
  return (p) => p.toLowerCase().startsWith(root.toLowerCase()) ? p.slice(root.length) : null;
}
// GFx\Main.bfs is an archive (u32 magic, u32 count, count x {u32 offset, u32 size, char name[16]}); only Flags.bmp is kept
function bfsEntry(buf, want) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), n = dv.getUint32(4, true);
  for (let k = 0; k < n && 8 + 24 * k + 24 <= buf.length; k++) {
    const o = dv.getUint32(8 + 24 * k, true), sz = dv.getUint32(12 + 24 * k, true);
    let name = ''; for (let i = 0; i < 16; i++) { const ch = buf[16 + 24 * k + i]; if (!ch) break; name += String.fromCharCode(ch); }
    if (name.toLowerCase() === want.toLowerCase() && o + sz <= buf.length) return buf.slice(o, o + sz);
  }
  return null;
}
function keepGfx(files, rel, data) { files[/^gfx\/main\.bfs$/i.test(rel) ? 'gfx/main.bfs' : rel] = data; }
// a bitmap from GFx\Main.bfs (or from the older stored copies gfx/flags.bmp, gfx/shirts.bmp)
function gfxFile(files, name) {
  if (!files) return null;
  if (files['gfx/' + name]) return files['gfx/' + name];
  try { return files['gfx/main.bfs'] ? bfsEntry(files['gfx/main.bfs'], name) : null; } catch (e) { return null; }
}
async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer()); const dv = new DataView(buf.buffer);
  let e = buf.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('This is not a valid zip file.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = {};
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = new TextDecoder('latin1').decode(buf.subarray(p + 46, p + 46 + nl)).replace(/\\/g, '/'); p += 46 + nl + xl + cl;
    if (name.endsWith('/')) continue;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true); const raw = buf.subarray(ds, ds + csize);
    out[name] = { method, raw };
  }
  const fix = normalize(Object.keys(out)); if (!fix) throw new Error('UEFA2000b.exe was not found in the zip file.');
  const files = {};
  for (const [name, f] of Object.entries(out)) { const rel = fix(name); if (!rel || !NEEDED.test(rel)) continue;
    keepGfx(files, rel, f.method === 0 ? f.raw.slice() : new Uint8Array(await new Response(new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())); }
  return files;
}
async function readFolder(fileList) {
  const list = [...fileList]; const fix = normalize(list.map((f) => f.webkitRelativePath || f.name));
  if (!fix) throw new Error('UEFA2000b.exe was not found. Choose the folder the game is installed in.');
  const files = {};
  for (const f of list) { const rel = fix(f.webkitRelativePath || f.name); if (rel && NEEDED.test(rel)) keepGfx(files, rel, new Uint8Array(await f.arrayBuffer())); }
  return files;
}

const REQUIRED = ['uefa2000b.exe', 'data/data.bin', 'data/configs/language.cfg', 'controlsscripts/english/controlscript.csc', 'tabletextscript/english/tabletextscript.ttc', 'textdescriptionscript/english/textdescriptionscript.tdc', 'data/tables/matchday.txt', 'data/tactics/4-4-2.pdt', 'data/names/firstnames.dat'];
function checkFiles(files) {
  const have = new Set(Object.keys(files).map((p) => p.toLowerCase()));
  const missing = REQUIRED.filter((r) => !have.has(r));
  if (missing.length) throw new Error('These files are missing: ' + missing.join(', ') + '. Make sure the folders Data, Scripts, ControlsScripts, TableTextScript and TextDescriptionScript and UEFA2000b.exe are included.');
  return files;
}

// ------------------------------------------------------------ flags (GFx\Main.bfs > Flags.bmp, like the original's image list 0x6007a0, built in 0x472177)
const FLAGS = { url: null, cols: 40 };
// 24-bit BMP -> {w, h, px: RGB per pixel, top row first}
function readBmp(b) {
  if (!b || b[0] !== 0x42 || b[1] !== 0x4d) return null;
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const off = dv.getUint32(10, true), w = dv.getInt32(18, true), hh = dv.getInt32(22, true), bpp = dv.getUint16(28, true);
  if (bpp !== 24 || w <= 0 || !hh) return null;
  const H = Math.abs(hh), stride = (w * 3 + 3) & ~3, px = new Uint8Array(w * H * 3);
  for (let y = 0; y < H; y++) { const row = off + (hh > 0 ? H - 1 - y : y) * stride;
    for (let x = 0; x < w; x++) { const i = row + 3 * x, j = 3 * (y * w + x); px[j] = b[i + 2]; px[j + 1] = b[i + 1]; px[j + 2] = b[i]; } }
  return { w, h: H, px };
}
// magenta (255,0,255) is transparent in all bitmaps of the original
function bmpUrl(bm, x0, y0, w, h, map) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'), img = cx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = 3 * ((y0 + y) * bm.w + x0 + x), j = 4 * (y * w + x); let r = bm.px[i], g = bm.px[i + 1], b = bm.px[i + 2];
    if (r === 255 && g === 0 && b === 255) continue;
    if (map) [r, g, b] = map(r, g, b);
    img.data[j] = r; img.data[j + 1] = g; img.data[j + 2] = b; img.data[j + 3] = 255;
  }
  cx.putImageData(img, 0, 0); return cv.toDataURL('image/png');
}
const SHIRTS = { bm: null, cache: new Map() };
const GFX = { files: null, bm: new Map(), url: new Map() };
// cell idx of a strip of w x h icons from a bitmap in GFx\Main.bfs (null without GFx)
function gfxCell(name, idx, w, h, perRow) {
  const key = name + ':' + idx; if (GFX.url.has(key)) return GFX.url.get(key);
  let bm = GFX.bm.get(name);
  if (bm === undefined) { try { bm = readBmp(gfxFile(GFX.files, name)); } catch (e) { bm = null; } GFX.bm.set(name, bm); }
  let url = null;
  if (bm) { const per = perRow || Math.floor(bm.w / w), x = (idx % per) * w, y = Math.floor(idx / per) * h; if (x + w <= bm.w && y + h <= bm.h) url = bmpUrl(bm, x, y, w, h); }
  GFX.url.set(key, url); return url;
}
// true when the complete GFx\Main.bfs is stored (older versions kept only flags.bmp and shirts.bmp)
function gfxComplete() { return !!(GFX.files && GFX.files['gfx/main.bfs']); }
// all n cells of an animation as one horizontal strip (for a CSS steps() animation)
function gfxStrip(name, n, w, h, perRow) {
  const key = name + ':strip'; if (GFX.url.has(key)) return GFX.url.get(key);
  let url = null;
  try {
    const cells = []; for (let i = 0; i < n; i++) { const u = gfxCell(name, i, w, h, perRow); if (!u) throw 0; cells.push(u); }
    const bm = GFX.bm.get(name), cv = document.createElement('canvas'); cv.width = w * n; cv.height = h;
    const cx = cv.getContext('2d'), img = cx.createImageData(w * n, h);
    for (let i = 0; i < n; i++) { const x0 = (i % perRow) * w, y0 = Math.floor(i / perRow) * h;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const s = 3 * ((y0 + y) * bm.w + x0 + x), d = 4 * (y * w * n + i * w + x), r = bm.px[s], g = bm.px[s + 1], b = bm.px[s + 2];
        if (r === 255 && g === 0 && b === 255) continue; img.data[d] = r; img.data[d + 1] = g; img.data[d + 2] = b; img.data[d + 3] = 255; } }
    cx.putImageData(img, 0, 0); url = cv.toDataURL('image/png');
  } catch (e) { url = null; }
  GFX.url.set(key, url); return url;
}
function loadFlags(files) {
  FLAGS.url = null; SHIRTS.bm = null; SHIRTS.cache.clear(); GFX.files = files; GFX.bm.clear(); GFX.url.clear();
  try { const bm = readBmp(gfxFile(files, 'flags.bmp'));
    if (bm) { FLAGS.url = bmpUrl(bm, 0, 0, bm.w, bm.h); FLAGS.cols = Math.floor(bm.w / 16); document.documentElement.style.setProperty('--flags', `url(${FLAGS.url})`); } } catch (e) { FLAGS.url = null; }
  try { SHIRTS.bm = readBmp(gfxFile(files, 'shirts.bmp')); } catch (e) { SHIRTS.bm = null; }
}

function loanBlockMount(el, p, L) {

async function loanBlockClick(e, p, L, close, el) {

async function transferClick(e) {

  if (e.target.closest('[data-msearch]')) { doSearch(); return true; }
  const an = e.target.closest('[data-answer]'); if (an) { await rpc('answer', { offer: +an.dataset.answer, accept: an.dataset.yes === '1' }); toast(an.dataset.yes === '1' ? 'Bod geaccepteerd. De koper onderhandelt nu met de speler.' : 'Bod afgewezen.'); await loadTransfers(); renderGame(); return true; }
  const lo = e.target.closest('[data-loan]'); if (lo) { await rpc('answerLoan', { loan: +lo.dataset.loan, accept: lo.dataset.yes === '1' }); toast(lo.dataset.yes === '1' ? 'Huur geaccepteerd. De speler beslist binnen een week.' : 'Huuraanbieding afgewezen.'); await loadTransfers(); renderGame(); return true; }
  const bc = e.target.closest('[data-bconfirm]'); if (bc) { try { await rpc('confirmBuy', { offer: +bc.dataset.bconfirm }); toast('Transfer bevestigd. De speler komt binnen een week.'); } catch (err) { toast(err.message); } await loadTransfers(); renderGame(); return true; }
  const sc2 = e.target.closest('[data-sconfirm]'); if (sc2) { try { await rpc('confirmSale', { offer: +sc2.dataset.sconfirm }); toast('Verkoop bevestigd. Andere biedingen op deze speler zijn afgewezen.'); } catch (err) { toast(err.message); } await loadTransfers(); renderGame(); return true; }
  if (await loanActClick(e)) return true;
  const lp = e.target.closest('[data-lnp]'); if (lp) { const x = (S.tr.loanedIn || []).find((y) => y.player.id === +lp.dataset.lnp); if (x) playerSheet(x.player, loanedActions(x.player)); return true; }
  const lc = e.target.closest('[data-lconfirm]'); if (lc) { await rpc('confirmLoan', { loan: +lc.dataset.lconfirm }); toast('Verhuur bevestigd.'); await loadTransfers(); renderGame(); return true; }
  const rn = e.target.closest('[data-renew]'); if (rn) { const o = S.tr.outgoing.find((x) => x.player.id === +rn.dataset.renew); if (o) contractSheet(o.player, true); return true; }
  const mp = e.target.closest('[data-mp]'); if (mp) { openMarketPlayer(+mp.dataset.mp); return true; }
  const ow = e.target.closest('[data-own]'); if (ow) { const p = S.tr.listed.find((x) => x.id === +ow.dataset.own); if (p) playerSheet({ ...p, natName: '' }, ownPlayerActions(p)); return true; }
  return false;
}

function staffSheet(s, own) {
  const start = own ? (s.demand > s.wage ? Math.ceil(s.demand * 1.05 / 1000) * 1000 : s.wage) : s.demand, comp = Math.trunc(s.wage / 6);
  const el = h(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.name)}"><div>
    <h3>${esc(s.name)}</h3><p class="note" style="font-size:14px">${ROLE1_NL[s.role]} · ${s.age} jaar · ${esc(qualsNL(s.quals))}</p>
    <ul class="list" style="margin-top:12px"><li><div class="grow">Niveau</div><div class="end num">${s.ability}</div></li>
      ${own ? `<li><div class="grow">Tevredenheid</div><div class="end">${s.morale} · ${mood(s.morale)}</div></li><li><div class="grow">Salaris per jaar</div><div class="end num">${money(s.wage)}</div></li>` : ''}
      <li><div class="grow">Wil minimaal verdienen</div><div class="end num">${money(s.demand)}</div></li></ul>
    <div class="deal"><label>${own ? 'Nieuw jaarsalaris' : 'Jaarsalaris dat je biedt'}<input type="text" inputmode="numeric" id="sw" value="${start}"></label><p class="note" style="padding:0" id="swm">${money(start)} per jaar</p>
      <button class="btn wide" data-swage>${own ? 'Salaris aanpassen' : 'Benaderen'}</button>
      ${own ? `<button class="btn alt wide" data-ssack>Ontslaan (vergoeding ${money(comp)})</button>` : ''}
      <button class="btn alt wide" data-close>Sluiten</button></div></div></div>`).firstChild;
  const sw = $('#sw', el); sw.addEventListener('input', () => { $('#swm', el).textContent = `${money(numVal(sw))} per jaar`; });
  el.addEventListener('click', async (e) => {
    if (e.target === el || e.target.closest('[data-close]')) return el.remove();
    try {
      if (e.target.closest('[data-swage]')) {
        const wage = numVal(sw); if (!wage) return toast('Vul een bedrag in.');
        if (own) { await rpc('staffWage', { id: s.id, wage }); toast(wage >= s.demand ? `${s.name} is blij met het nieuwe salaris.` : `Salaris aangepast, maar ${s.name} wil nog steeds meer.`); }
        else { await rpc('staffApproach', { id: s.id, wage }); toast(`${s.name} is benaderd. Het antwoord komt over een paar weken via de post.`); }

const REG_KEYS = ['currency', 'date', 'salaries', 'ratings', 'process', 'autoHelp', 'pitch'];
async function applyRegistry() {
  const p = prefs(), o = {}; for (const k of REG_KEYS) if (p[k] != null) o[k] = p[k];
  try { const r = await rpc('setOptions', { opts: o }); Object.assign(OPT, r.cur); if (r.frame) S.fr = r.frame; } catch (e) { /* standaard */ }
}
// in-game "Pop Options" (schermid 0x41, init 0x4bf990, OK 0x4c0370), tabbladen Game en Match Tactics (Sound weggelaten: geen geluid in de web).
// Game: links History / Financial Year / Financial Start Month / Currency / Date / Contracts Salaries; het origineel zet die zes in het spel op grijs (0x4c0bfc),
// in de web mogen Currency en Date wel (keuze Kevin 23-11). Rechts Ratings, Process Game, Auto Help (Tooltips, Match en 3D Settings weggelaten).
// Match Tactics: alleen Pitch Tactics Toggles (Match Highlights en Match Toggles horen bij het kijken naar wedstrijden). Help 073 / 076.
async function gameSettingsSheet() {
  let L, cur; try { const r = await rpc('options'); L = r.lists; cur = r.cur; } catch (e) { return toast('Error: ' + e.message); }
  const st = { ...cur, pitch: [...cur.pitch] }; let tab = 'game';
  const back = h(`<div class="ci-back" role="dialog" aria-modal="true" aria-label="Options"><div class="ci op"></div></div>`).firstChild;
  document.body.append(back);
  const close = () => { back.remove(); document.removeEventListener('keydown', key); };
  const key = (e) => { if (e.key === 'Escape' && !document.querySelector('.gsheet,.msg-back,.hlp-back')) close(); };
  document.addEventListener('keydown', key);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  const sel = (id, label, items, v, dis) => `<label class="op-l" for="op-${id}">${esc(label)}</label><select id="op-${id}" data-k="${id}" ${dis ? 'disabled' : ''}>${items.map(([a, t]) => `<option value="${a}" ${a === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const draw = () => {
    const body = tab === 'game' ? `<div class="op-g">
        <div class="op-c">${sel('history', 'History', L.history.map((v) => [v, String(v)]), st.history, 1)}${sel('finYear', 'Financial Year', L.finYear.map((t, i) => [i, t]), st.finYear, 1)}
          ${sel('startMonth', 'Financial Start Month', L.months.map((t, i) => [i, t]), st.startMonth, 1)}${sel('currency', 'Currency', L.currency.map((t, i) => [i, t]), st.currency)}
          ${sel('date', 'Date', L.date.map((t, i) => [i, t]), st.date)}${sel('salaries', 'Contracts Salaries', L.salaries.map((t, i) => [i, t]), st.salaries, 1)}</div>
        <div class="op-c">${sel('ratings', 'Ratings', L.ratings.map((t, i) => [i, t]), st.ratings)}${sel('process', 'Process Game', L.process.map((t, i) => [i, t]), st.process)}
          <span class="op-l" id="op-ah-l">Auto Help</span><button class="op-chk" id="op-ah" role="checkbox" aria-checked="${!!st.autoHelp}" aria-labelledby="op-ah-l">${st.autoHelp ? RL_YES : ''}</button></div></div>`
      : `<section class="md-sec op-pt"><h3>Pitch Tactics Toggles</h3><div class="md-t rl-t" role="table"><div class="md-r md-h" role="row"><span>Description</span><span>!</span></div>
        ${L.pitch.map((t, i) => `<button class="md-r op-tg" role="row" data-tg="${i}" aria-pressed="${!!st.pitch[i]}"><span>${esc(t)}</span><b>${st.pitch[i] ? RL_YES : ''}</b></button>`).join('')}</div></section>`;
    back.firstChild.innerHTML = `<header class="ci-hd"><h2><span>Options</span></h2>
        <div class="ci-tabs" role="tablist">${[['game', 'Game'], ['tactics', 'Match Tactics']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>
        <button class="ci-nav mf-help" data-help aria-label="Help">?</button></header>
      <div class="ci-body op-b">${body}</div>
      <footer class="mf-ft msg-ft pr-ft">${RED_OK()}${RED_X()}</footer>`;
    back.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; draw(); });
    back.querySelectorAll('select[data-k]').forEach((x) => x.onchange = () => { st[x.dataset.k] = +x.value; });
    const ah = back.querySelector('#op-ah'); if (ah) ah.onclick = () => { st.autoHelp = st.autoHelp ? 0 : 1; draw(); back.querySelector('#op-ah').focus({ preventScroll: true }); };
    back.querySelectorAll('[data-tg]').forEach((b) => b.onclick = () => { const i = +b.dataset.tg; st.pitch[i] = st.pitch[i] ? 0 : 1; draw(); });
    back.querySelector('[data-help]').onclick = () => helpSheet(tab === 'game' ? 73 : 76);
    back.querySelector('[data-x]').onclick = close;
    back.querySelector('[data-ok]').onclick = async () => {
      const opts = { currency: st.currency, date: st.date, ratings: st.ratings, process: st.process, autoHelp: st.autoHelp, pitch: st.pitch };
      close();
      let r; try { r = await rpc('setOptions', { opts }); } catch (e) { return toast('Error: ' + e.message); }
      Object.assign(OPT, r.cur); if (r.frame) S.fr = r.frame;
      savePrefs({ ...prefs(), ...opts });
      if (S.ft) S.ft.data = null; resetCaches(); renderGame(); if (S.tab === 'today') loadToday(); else refreshTab();
    };
  };
  draw();
  back.querySelector('[data-ok]').focus({ preventScroll: true });
}
function resetCaches() { if (S.ts) S.ts.data = null; S.squad = null; S.fixtures = null; S.lineup = null; S.sel = null; S.mails = null; S.news = null; S.tr = null; S.fin = null; S.staff = null; S.sp = null; S.ho = null; S.trn = null; S.stad = null; S.bank = null; S.yo = null; S.shop = null; S.ins = null; S.ctable = S.cfix = S.pstats = S.mgrs = S.refs = null; S.rec = S.th = S.eos = S.eosC = S.recPast = null; }
async function frameClick(e) {
  const t = e.target.closest('.gf-side button, [data-scr]'); if (!t) return false;
  if (t.getAttribute('aria-disabled') === 'true') { if (t.dataset.scr || t.id === 'g-comp') toast('Not available in the web version yet.'); return true; }
  if (t.dataset.scr) { gotoScreen(t.dataset.scr); return true; }
  if (t.dataset.node) { const k = t.dataset.node, node = GTREE.find((x) => x[0] === k); if (!node[3]) { gotoScreen(k); return true; }
    const first = (node[3].find(([kk]) => GLEAF[kk]) || [])[0]; if (first) gotoScreen(first); else { S.open = k; renderGame(); } return true; }
  if (t.dataset.note) { gotoScreen(GNOTE[+t.dataset.note][1]); return true; }
  if (t.id === 'go') { doContinue(); return true; }
  if (t.id === 'g-home') { gotoScreen('today'); return true; }
  if (t.id === 'g-back') { S.hpos--; gotoScreen(S.hist[S.hpos], true); return true; }
  if (t.id === 'g-fwd') { S.hpos++; gotoScreen(S.hist[S.hpos], true); return true; }
  if (t.id === 'g-save') { saveGame(); return true; }
  if (t.id === 'g-set') { gameSettingsSheet(); return true; }
  if (t.id === 'g-help') { helpSheet(); return true; }
  if (t.id === 'g-new') { uefaMsg('Do you really want to start a new game?').then((ok) => { if (ok) newGameFlow(); }); return true; } // originele tekst (TableTextScript)
  if (t.id === 'g-exit') { uefaMsg('Are you sure you want to quit to the start screen ?').then((ok) => { if (ok) { START.view = 'title'; showStart(); } }); return true; } // origineel: "... quit to desktop ?" (aangepast, keuze Kevin 23-11)
  return false;
}

function renderGame() {
  document.documentElement.lang = 'en'; START.busy = false; clearInterval(S.timer);
  if (!S.scr) { S.scr = 'today'; S.tab = 'today'; S.open = 'today'; S.hist = ['today']; S.hpos = 0; }
  const old = { mail: viewMail, squad: viewSquad, table: viewComp, menu: viewMenu }[S.tab];
  const body = old ? `<div class="gf-old" lang="nl">${old()}</div>` : S.tab === 'teamsel' ? viewTeamSel() : viewToday();
  const m = $('#gfm'), keep = m && S.lastScr === S.scr ? m.scrollTop : 0, rs = S.lastScr === S.scr && $('#ts-lists') ? [$('#ts-lists').scrollTop, $('.ts-tasks')?.scrollTop || 0] : null;
  app.innerHTML = gframe(body); S.lastScr = S.scr;
  if (keep) $('#gfm').scrollTop = keep;
  if (S.tab === 'teamsel' && rs) { if ($('#ts-lists')) $('#ts-lists').scrollTop = rs[0]; if ($('.ts-tasks')) $('.ts-tasks').scrollTop = rs[1]; }
  if (S.tab === 'today') drawGraphs();
  if (S.tab === 'today' && (!S.ft || !S.ft.data) && !S.ftLoading) loadToday(!S.ftOpened && (S.ftOpened = true));
  else if (!S.fr && !S.frLoading) { S.frLoading = true; rpc('screen', { key: S.scr, id: SCRID[S.scr] }).then((r) => { S.fr = r.frame; S.frLoading = false; renderGame(); if (r.help) helpSheet(); }).catch(() => { S.frLoading = false; }); }
}

async function refreshTab() {
  if (S.tab === 'squad' && S.sub === 'transfers' && !S.tr) await loadTransfers();
  if (S.tab === 'squad' && S.sub === 'players' && S.psub === 'youth' && !S.yo) { const r = await rpc('youth'); S.yo = r.yo; S.yonats = r.nats; }
  if (S.tab === 'squad' && S.sub === 'players' && !S.squad) { const r = await rpc('squad', { club: S.dash.club.id }); S.squad = r.squad; S.nats = r.nats; }
  if (S.tab === 'squad' && S.sub === 'lineup') { const r = await rpc('lineup'); S.lineup = r.lineup; }
  if (S.tab === 'teamsel' && (!S.ts || !S.ts.data)) await loadTeamSel();
  if (S.tab === 'squad' && S.sub === 'training' && !S.trn) { const r = await rpc('training'); S.trn = r.tr; }
  if (S.tab === 'menu' && S.page === 'sponsors' && !S.sp) { const r = await rpc('sponsors'); S.sp = r.sp; }
  if (S.tab === 'menu' && S.page === 'hoard' && !S.ho) { const r = await rpc('hoardings'); S.ho = r.ho; }
  if (S.tab === 'menu' && S.page === 'staff' && !S.staff) { S.staff = await rpc('staff', { role: S.srole }); }
  if (S.tab === 'menu' && S.page === 'rec') {
    const R = S.recv;
    if (!S.recClubs) { const r = await rpc('recClubs'); S.recClubs = r.clubs; }
    if (!S.comps) { const r = await rpc('comps'); S.comps = r.comps; }
    if (R.tab === 'club' && (!S.rec || S.rec.id !== R.club)) { const r = await rpc('recClub', { club: R.club }); S.rec = r.rec; }
    if (R.tab === 'club' && typeof R.per === 'number' && (!S.recPast || S.recPast.season !== R.per || S.recPast.club !== R.club)) { const r = await rpc('recClubSeason', { club: R.club, season: R.per }); S.recPast = r.rs ? { ...r.rs, club: R.club } : null; if (!S.recPast) R.per = 'season'; }
    if (R.tab === 'transfers' && (!S.th || S.th.div !== R.div)) { const r = await rpc('recTransfers', { div: R.div }); S.th = r.th; }
    if (R.tab === 'eos') {
      if (!S.eosC) { const r = await rpc('eosCountries'); S.eosC = r.countries; if (!R.eco) R.eco = r.own; }
      const co = S.eosC.find((x) => x.id === R.eco) || S.eosC[0];
      if (co) { const season = co.seasons.includes(R.eseason) ? R.eseason : co.seasons[0]; if (!S.eos || S.eos.co !== co.id || S.eos.season !== season) { const r = await rpc('eos', { co: co.id, season }); S.eos = r.eos; } }
    }
  }
  if (S.tab === 'menu' && S.page === 'shop' && !S.shop) { const r = await rpc('shop'); S.shop = r.shop; }
  if (S.tab === 'menu' && S.page === 'ins' && !S.ins) { const r = await rpc('insurance'); S.ins = r.ins; }
  if (S.tab === 'menu' && S.page === 'bank' && !S.bank) { const r = await rpc('bank'); S.bank = r.bank; }
  if (S.tab === 'menu' && S.page === 'stadium' && !S.stad) { const r = await rpc('stadium'); S.stad = r.st; }
  if (S.tab === 'menu' && S.page === 'finance' && !S.fin) { const r = await rpc('finance'); S.fin = r.fin; }
  if (S.tab === 'table') {
    const cs = csState();
    if (!S.comps) { const r = await rpc('comps'); S.comps = r.comps; }
    const sub = S.csub || 'table';
    if (sub === 'table' && (!S.ctable || S.ctable.div !== +cs.div)) { const r = await rpc('ctable', { div: +cs.div }); S.ctable = r.ctable; }
    if (sub === 'fixtures' && cs.fkey === 'mine' && !S.fixtures) { const r = await rpc('fixtures', { club: S.dash.club.id }); S.fixtures = r.fixtures; S.friendlies = r.friendlies; }
    if (sub === 'fixtures' && cs.fkey !== 'mine' && (!S.cfix || S.cfix.key !== cs.fkey)) { const r = await rpc('cfixtures', { key: cs.fkey }); S.cfix = { ...r.cfix, key: cs.fkey }; }
    const kind = cs.skind || 'players';
    if (sub === 'stats' && kind === 'players' && (!S.pstats || S.pstats.div !== +cs.sdiv || S.pstats.comp !== cs.scomp)) { const r = await rpc('pstats', { div: +cs.sdiv, comp: cs.scomp }); S.pstats = { ...r.pstats, comp: cs.scomp }; }
    if (sub === 'stats' && kind === 'managers' && (!S.mgrs || S.mgrs.div !== +cs.sdiv)) { const r = await rpc('mgrs', { div: +cs.sdiv }); S.mgrs = r.mgrs; }
    if (sub === 'stats' && kind === 'referees' && (!S.refs || (cs.rco && S.refs.refs.co !== cs.rco) || S.refs.refs.comp !== cs.scomp)) { const r = await rpc('refs', { co: cs.rco || 0, comp: cs.scomp }); S.refs = r; }
  }
  if (S.tab === 'mail' && S.msub !== 'news' && !S.mails) { const r = await rpc('inbox'); S.mails = r.mails; S.dash.unread = r.unread; }
  if (S.tab === 'mail' && S.msub === 'news' && !S.news) { const r = await rpc('news'); S.news = r.news; S.dash.unread = r.unread; }
  renderGame();
}
async function doContinue() {
  if (S.busy) return;
  S.busy = true; S.busyText = ''; S.busyPct = 4; renderGame();
  const t0 = Date.now(), tick = setInterval(() => { S.busyPct = Math.min(96, 4 + (Date.now() - t0) / 60); const b = $('.gb-prog i'); if (b) b.style.width = S.busyPct + '%'; }, 200);
  let blocked = false;
  try {
    const r = await rpc('continue', {}, (p) => { const [d, m, y] = p.split('-').map(Number); S.busyText = `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${String(y % 100).padStart(2, '0')}`; const el = $('.gd-date'); if (el) el.textContent = S.busyText; const t = $('.gb-prog span'); if (t) t.textContent = S.busyText; });
    blocked = !!r.result.blocked; S.fr = null; if (S.ft) S.ft.data = null;
    S.dash = r.dash; S.squad = null; S.fixtures = null; S.lineup = null; S.sel = null; S.mails = null; S.news = null; S.tr = null; S.fin = null; S.staff = null; S.sp = null; S.ho = null; S.trn = null; S.stad = null; S.bank = null; S.yo = null; S.shop = null; S.ins = null; S.ctable = S.cfix = S.pstats = S.mgrs = S.refs = null; S.rec = S.th = S.eos = S.eosC = S.recPast = null;
    if (r.result.blocked) toast(SHEET_MSG[r.result.blocked] || 'Controleer je opstelling.');
  } catch (e) { toast('Error: ' + e.message); }
  clearInterval(tick); S.busy = false; S.busyText = '';
  await gotoScreen(blocked ? 'tm-sel' : 'today');
}

app.addEventListener('change', async (e) => {
  const id = e.target.id;
  if (id === 'ts-view') { S.ts.view = e.target.value; renderGame(); return; }
  if (id === 'ts-tac') { await tsAct({ op: 'formation', preset: +e.target.value }); return; }
  if (id === 'rcsel') { S.recv.club = +e.target.value; S.rec = S.recPast = null; S.recv.per = 'season'; renderGame(); return refreshTab(); }
  if (id === 'rtsel') { S.recv.div = +e.target.value; S.th = null; renderGame(); return refreshTab(); }
  if (id === 'rtmine') { S.recv.onlyMine = e.target.checked; renderGame(); return; }
  if (id === 'eosco') { S.recv.eco = +e.target.value; S.recv.ediv = 'land'; S.eos = null; renderGame(); return refreshTab(); }
  if (id === 'eoss') { S.recv.eseason = +e.target.value; S.eos = null; renderGame(); return refreshTab(); }
  if (id === 'eosd') { S.recv.ediv = e.target.value; renderGame(); return; }
  if (id === 'crsel') { csState().rco = +e.target.value; S.refs = null; renderGame(); return refreshTab(); }
  if (!['ctsel', 'cfsel', 'cssel'].includes(id)) return;
  const cs = csState(), v = e.target.value;
  if (id === 'ctsel') cs.div = +v; else if (id === 'cfsel') cs.fkey = v; else cs.sdiv = +v;
  renderGame(); await refreshTab();
});

const fmtUpd = (t, f) => { const d = new Date(t), p = [String(d.getDate()).padStart(2, '0'), String(d.getMonth() + 1).padStart(2, '0'), String(d.getFullYear() % 100).padStart(2, '0')]; return (f === 1 ? [p[1], p[0], p[2]] : f === 2 ? [p[2], p[1], p[0]] : p).join('/'); };
const saveName = (x) => x.meta.name || x.meta.club;
async function saveLoadPopup(mode, onCancel) {

  const confirm = async (msg) => (await uefaMsg(msg)) === true; // berichtvenster van het origineel: vinkje / rode X
  const draw = () => {
    const m = sel ? sel.meta : null, f = m && m.dateFmt;
    back.firstChild.innerHTML = `<header class="ci-hd"><h2><span>${load ? 'Load Game' : 'Save Game'}</span></h2><button class="ci-nav mf-help" data-help aria-label="Help">?</button></header>

    back.querySelectorAll('[data-key]').forEach((b) => b.onclick = () => {

      <span class="su-sw" style="background:${MGR_COL[k]}"></span>
      <label for="su-n${k}">Manager</label><input id="su-n${k}" type="text" maxlength="40" autocomplete="${k ? 'off' : 'name'}" ${k ? 'disabled' : `value="${esc(st.name)}"`}>
      <label id="su-cl${k}">Nationality</label>${combo(k, k ? 1 : st.nationality)}</div>`;
  frame(`<div class="fr-pane"><h1>Setup Manager(s)</h1>
    <form id="su" class="su" novalidate>${[0, 1, 2, 3].map(row).join('')}
      <p class="fr-note">Managers 2 to 4 (several players on one device) are not available in the web version yet.</p>
      <p id="su-msg" class="err" role="alert">${esc(msg || '')}</p>
      <div class="su-bar"><button type="button" class="btn alt" id="su-gs">Game Settings</button><span class="sp"></span>
        <button class="btn" id="su-ok">OK</button><button type="button" class="btn alt" id="su-x">Cancel</button></div></form></div>`);
  const keep = () => { st.name = $('#su-n0').value; st.nationality = +$('#su-c0').dataset.v; };
  natPicker($('#su-c0'), o.nationalities, (id) => { st.nationality = id; }, 'Nationality');
  $('#su-x').onclick = () => { START.view = 'title'; showStart(); };
  $('#su-gs').onclick = () => { keep(); settingsView(); };
  $('#su').onsubmit = async (e) => {
    e.preventDefault(); keep();
    const name = st.name.replace(/^ +/, '').trim();
    if (!name) { $('#su-msg').textContent = 'Enter a manager name.'; $('#su-n0').focus(); return; }
    savePrefs({ ...prefs(), name, nationality: st.nationality, currency: st.settings.currency, date: st.settings.date, salaries: st.settings.salaries });
    waiting('Start Game', 'Loading the database and preparing the season. This usually takes 5 to 20 seconds.', 'Database');
    try { const data = await rpc('newGame', { name, nationality: st.nationality, settings: st.settings }); await applyRegistry(); START.busy = false; pickClub(data); }
    catch (err) { failed('Starting a new game failed', err, () => newGameFlow()); }
  };
  if (!st.name) $('#su-n0').focus({ preventScroll: true });
}
// Club Info (popup 0x4c8c70): tabs General and Players, arrows go to the previous/next club of the list (0x4c9360), OK closes
// icnPos.bmp als scherpe CSS-cirkel in dezelfde kleuren (VEC.POSCOL), met de positieletter (0x8a)
function posIcon(line, lb) {
  return `<span class="ci-pos p${line}" title="${esc(lb.pos[line] || '')}">${esc(lb.posShort[line] || '')}</span>`;
}
// Role.bmp als vectorveldje (VEC.role), stip op dezelfde plek
function roleIcon(role, lb) {
  return `<img class="ci-role" src="${VEC.role(role)}" alt="${esc(lb.role[role] || '')}" title="${esc(lb.role[role] || '')}">`;
}
async function clubInfo(list, idx, onMove) {
  let tab = 'general', info = null;
  const back = h(`<div class="ci-back" role="dialog" aria-modal="true" aria-label="Club Info"><div class="ci"><p class="ci-wait">Loading…</p></div></div>`).firstChild;
  document.body.append(back);
  const close = () => { back.remove(); document.removeEventListener('keydown', key); };
  const key = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft' && !e.target.closest('input')) go(-1); else if (e.key === 'ArrowRight' && !e.target.closest('input')) go(1); };
  document.addEventListener('keydown', key);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  const players = (title, rows, lb) => `<section class="ci-sec"><h3>${esc(title)}</h3>
    <div class="ci-tab" role="table"><div class="ci-pr ci-ph" role="row"><span>Name</span><span>Pos</span><span>Role</span><span class="r">Age</span><span class="r">Rtg</span><span class="r">Value</span></div>
    ${rows.map((p) => `<div class="ci-pr" role="row"><span class="ci-pn"><span>${esc(p.name)}</span>${p.nonEC ? (gfxStrip('icnEC.bmp', 16, 10, 12, 4) ? `<span class="ci-ec" role="img" aria-label="Non EC Player" title="Non EC Player" style="background-image:url(${gfxStrip('icnEC.bmp', 16, 10, 12, 4)})"></span>` : '<span class="ci-ect" title="Non EC Player">EC</span>') : ''}${p.flag ? flagHTML(p.nat) : ''}</span>
      <span>${posIcon(p.line, lb)}</span><span>${roleIcon(p.role, lb)}</span><span class="r">${p.age}</span><span class="r">${p.rtg}</span><span class="r">${esc(p.value)}</span></div>`).join('')}</div></section>`;
  const draw = () => {
    const i = info, lb = i.labels, f = (k, v) => `<div class="ci-f"><span class="k">${esc(k)}</span><b>${esc(v)}</b></div>`;
    const body = tab === 'general' ? `<div class="ci-gen">
        <div class="ci-row3"><div class="ci-f"><span class="k">Manager</span><b class="ci-mg"><span>${esc(i.mgr)}</span>${flagHTML(i.mgrNat)}</b></div>${f('Division', i.division)}${f('Objective', i.objective)}</div>
        <div class="ci-kits"><div><span class="k">Home Kit</span>${shirtHTML(i.home) || '—'}</div><div><span class="k">Away Kit</span>${shirtHTML(i.away) || '—'}</div></div>
        <h3>Ground</h3><div class="ci-row3">${f('Name', i.ground)}${f('Capacity', i.capacity)}</div>
        <h3>Player Assets</h3><div class="ci-row3">${f('First Team', i.firstTeam)}${f('Youth Team', i.youth)}</div>
        <h3>Ground Assets</h3><div class="ci-row3">${f('Stadium', i.stadium)}${f('Facilities', i.facilities)}${f('Features', i.features)}</div></div>`
      : players(lb.lists[0] || 'First Team Players', i.squad, lb) + players(lb.lists[1] || 'Youth Players', i.youthPlayers, lb)
        + (gfxComplete() || !(i.squad || []).concat(i.youthPlayers || []).some((p) => p.nonEC) ? '' : '<p class="fr-note st-hint" style="margin-top:.6em">The animated Non EC ball comes from the folder GFx of your game. Choose your game files again (folder button on the start screen) and include the folder GFx.</p>');
    back.firstChild.innerHTML = `<header class="ci-hd">
        <button class="ci-nav" data-mv="-1" aria-label="Previous club" ${idx > 0 ? '' : 'disabled'}>◀</button><button class="ci-nav" data-mv="1" aria-label="Next club" ${idx < list.length - 1 ? '' : 'disabled'}>▶</button>
        <h2>${shirtHTML(i.home)}<span>${esc(i.name)}</span></h2>
        <div class="ci-tabs" role="tablist"><button role="tab" data-tab="general" aria-selected="${tab === 'general'}">${esc(lb.tabs[0])}</button><button role="tab" data-tab="players" aria-selected="${tab === 'players'}">${esc(lb.tabs[1])}</button></div>
        <button class="btn ci-ok" data-ok>OK</button></header><div class="ci-body">${body}</div>`;
    back.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; draw(); });
    back.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => go(+b.dataset.mv));
    back.querySelector('[data-ok]').onclick = close;
    back.querySelector('[data-ok]').focus({ preventScroll: true });
  };
  const load = async () => { try { info = await rpc('clubInfo', { club: list[idx].id }); draw(); } catch (e) { close(); toast('Club Info could not be shown.'); } };
  const go = async (d) => { const n = idx + d; if (n < 0 || n >= list.length) return; idx = n; if (onMove) onMove(list[idx].id); await load(); };
  await load();
}

// drop-down list with flags (a native <select> cannot show pictures); items {id, name, flag?} (flag defaults to id)
const itemFlag = (n) => flagHTML(n.flag != null ? n.flag : n.id);
function comboHTML(id, labelId, items, sel, disabled) {
  const n = items.find((x) => x.id === sel) || { name: '' };
  return `<div class="nat" id="${id}" data-v="${sel}">
      <button type="button" class="nat-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${labelId} ${id}-v" ${disabled ? 'disabled' : ''}>
        <span id="${id}-v" class="nat-v">${esc(n.name)}</span>${itemFlag(n)}<span class="nat-ar" aria-hidden="true"></span></button></div>`;
}
function natPicker(box, items, onPick, label = 'Choose') {
  const btn = box.querySelector('.nat-btn');
  const close = (focus) => { const l = box.querySelector('.nat-list'); if (l) l.remove(); btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', outside, true); if (focus) btn.focus(); };
  const outside = (e) => { if (!box.contains(e.target)) close(false); };
  const pick = (id) => {
    box.dataset.v = id; const n = items.find((x) => x.id === id);
    btn.innerHTML = `<span class="nat-v" id="${btn.getAttribute('aria-labelledby').split(' ')[1]}">${esc(n.name)}</span>${itemFlag(n)}<span class="nat-ar" aria-hidden="true"></span>`;
    onPick(id); close(true);
  };
  btn.onclick = () => {
    if (box.querySelector('.nat-list')) { close(true); return; }
    const cur = +box.dataset.v;
    const l = h(`<ul class="nat-list" role="listbox" aria-label="${esc(label)}">${items.map((n) => `<li role="option" aria-selected="${n.id === cur}" tabindex="-1" data-id="${n.id}"><span>${esc(n.name)}</span>${itemFlag(n)}</li>`).join('')}</ul>`).firstChild;
    box.append(l); btn.setAttribute('aria-expanded', 'true');
    // open upwards when there is more room above (landscape phones are low)
    const r = btn.getBoundingClientRect(), below = innerHeight - r.bottom, above = r.top;
    if (below < 220 && above > below) { l.classList.add('up'); l.style.maxHeight = Math.max(140, above - 12) + 'px'; } else l.style.maxHeight = Math.max(140, below - 12) + 'px';
    const sel = l.querySelector('[aria-selected="true"]') || l.firstChild; sel.scrollIntoView({ block: 'center' }); sel.focus({ preventScroll: true });
    l.onclick = (e) => { const li = e.target.closest('li'); if (li) pick(+li.dataset.id); };
    l.onkeydown = (e) => {
      const li = document.activeElement.closest('li'); if (!li) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const nx = e.key === 'ArrowDown' ? li.nextElementSibling : li.previousElementSibling; if (nx) nx.focus(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(+li.dataset.id); }
      else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); close(true); }
      else if (e.key.length === 1) { const k = e.key.toLowerCase(); const m = [...l.children].find((x) => x.textContent.trim().toLowerCase().startsWith(k)); if (m) m.focus(); }
    };
    document.addEventListener('pointerdown', outside, true);
  };
}
function settingsView() {
  const o = START.opts, st = START.setup.settings;
  const sel = (id, label, items, cur) => `<label for="gs-${id}">${esc(label)}</label><select id="gs-${id}">${items.map(([v, t]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  frame(`<div class="fr-pane"><h1>Game Settings</h1>
    <form id="gs" class="gs">
      ${sel('history', 'History', o.history.map((v) => [v, String(v)]), st.history)}
      ${sel('finYear', 'Financial Year', o.finYear.map((t, i) => [i, t]), st.finYear)}
      ${sel('startMonth', 'Financial Start Month', o.months.map((t, i) => [i, t]), st.startMonth)}
      ${sel('currency', 'Currency', o.currency.map((t, i) => [i, t]), st.currency)}
      ${sel('date', 'Date', o.date.map((t, i) => [i, t]), st.date)}
      ${sel('salaries', 'Contracts Salaries', o.salaries.map((t, i) => [i, t]), st.salaries)}
      <div class="su-bar"><span class="sp"></span><button class="btn" id="gs-ok">OK</button><button type="button" class="btn alt" id="gs-x">Cancel</button></div>
    </form></div>`);
  $('#gs-x').onclick = () => setupView();
  $('#gs').onsubmit = (e) => { e.preventDefault(); for (const k of ['history', 'finYear', 'startMonth', 'currency', 'date', 'salaries']) st[k] = +$('#gs-' + k).value; setupView(); };
}

// club choice: three columns (country | division | club), like the original lists side by side
function pickClub(data) {
  // "Select Team" (0x601df8): Country and Division lists, table Club | Manager | Objective | Bank; a row is chosen, Continue signs the contract (0x4394b0)
  const tree = data.tree;
  let ci = Math.max(0, tree.findIndex((c) => c.name === 'England')), di = 0, sel = null;
  START.view = 'club';
  const firstFree = (dv) => { const r = dv.clubs[dv.selIndex]; return r && !r.taken ? r.id : (dv.clubs.find((c) => !c.taken) || {}).id || null; };
  const go = async () => {
    const cl = tree[ci].divisions[di].clubs.find((c) => c.id === sel); if (!cl) return;
    waiting(cl.name, 'Signing your contract and building the season schedule.');
    try { const r = await rpc('pickClub', { club: cl.id }); START.busy = false; S.saveKey = null; S.dash = r.dash; resetGameState(); renderGame(); }
    catch (err) { failed('Choosing the club failed', err, () => newGameFlow()); }
  };
  const draw = (keepScroll) => {
    const co = tree[ci], dv = co.divisions[di];
    if (sel == null || !dv.clubs.some((c) => c.id === sel && !c.taken)) sel = firstFree(dv);
    const prev = keepScroll && $('.st-body') ? $('.st-body').scrollTop : 0;
    const countries = tree.map((c, i) => ({ id: i, name: c.name, flag: c.nat })), divisions = co.divisions.map((d, i) => ({ id: i, name: d.name, flag: 0 }));
    frame(`<div class="fr-pane st">
      <div class="st-top"><h1>${esc(data.title)}</h1>
        <div class="st-pick"><label id="st-cl">Country</label>${comboHTML('st-co', 'st-cl', countries, ci)}</div>
        <div class="st-pick"><label id="st-dl">Division</label>${comboHTML('st-dv', 'st-dl', divisions, di)}</div></div>
      <div class="st-table" role="listbox" aria-label="${esc(data.title)}">
        <div class="st-body"><div class="st-row st-head" aria-hidden="true"><span>Club</span><span>Manager</span><span>Objective</span><span>Bank</span></div>${dv.clubs.map((cl) => `<button type="button" class="st-row" role="option" data-club="${cl.id}" aria-selected="${cl.id === sel}" ${cl.taken ? 'aria-disabled="true"' : ''}>
          <span class="st-c">${shirtHTML(cl.shirt)}<b>${esc(cl.name)}</b></span><span class="st-m"><span>${esc(cl.mgr)}</span>${flagHTML(cl.mgrNat)}</span><span>${esc(cl.obj)}</span><span class="r">${esc(cl.bank)}</span></button>`).join('')}</div>
      </div></div>`, { info: `<span class="k">Manager</span><b>${esc(data.manager)}</b><span>Choose a club, then Continue</span>`, go: sel ? go : null });
    if (prev) $('.st-body').scrollTop = prev;
    natPicker($('#st-co'), countries, (id) => { ci = id; di = 0; sel = null; draw(); }, 'Country');
    natPicker($('#st-dv'), divisions, (id) => { di = id; sel = null; draw(); }, 'Division');
    app.querySelectorAll('[data-club]').forEach((b) => b.onclick = () => {
      // a second tap on the chosen club opens Club Info (the original opens it with a double click, 0x4393c0)
      if (+b.dataset.club === sel) { clubInfo(dv.clubs, dv.clubs.findIndex((c) => c.id === sel), (id) => { if (dv.clubs.some((c) => c.id === id && !c.taken)) { sel = id; draw(true); } }); return; }
      if (b.getAttribute('aria-disabled') === 'true') return; sel = +b.dataset.club; draw(true); $(`[data-club="${sel}"]`).focus({ preventScroll: true }); });
    const cur = $(`[data-club="${sel}"]`); if (cur && !keepScroll) cur.scrollIntoView({ block: 'nearest' });
  };
  draw();
}


// ---- Installeren en offline ----
// Alles draait in de browser; spelbestanden en opslagen staan in IndexedDB. Via http(s) registreren we een
// service worker (offline) en het manifest (installeerbaar). Op file:// werkt de pagina zonder internet al vanzelf.
const PWA = { evt: null, standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true };
(function pwaInit() {
  const web = location.protocol === 'https:' || location.protocol === 'http:';
  if (web && !document.querySelector('link[rel=manifest]')) {
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = 'apple-touch-icon.png'; document.head.appendChild(a);
    const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = 'icon-192.png'; document.head.appendChild(ic);
  }
  try { if (web && window.isSecureContext && 'serviceWorker' in navigator && window.top === window) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ingesloten of geblokkeerd */ }
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PWA.evt = e; if (S.tab === 'menu' && !S.page) renderGame(); });
  addEventListener('appinstalled', () => { PWA.evt = null; PWA.standalone = true; toast('Geïnstalleerd. Je vindt UEFA Manager nu tussen je apps.'); if (S.tab === 'menu' && !S.page) renderGame(); });
})();
function installItem() {
  if (PWA.standalone) return '';
  if (PWA.evt) return '<li class="tap" id="m-inst" tabindex="0"><div class="grow"><div>Installeren als app</div><div class="sub">Eigen venster en pictogram; werkt ook zonder internet</div></div></li>';
  return '<li class="tap" id="m-inst" tabindex="0"><div class="grow"><div>Gebruiken als app</div><div class="sub">Zo zet je het spel als app op je telefoon of computer</div></div></li>';
}
async function installApp() {
  if (PWA.evt) { const e = PWA.evt; PWA.evt = null; e.prompt(); try { await e.userChoice; } catch (x) {} renderGame(); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const steps = ios
    ? ['Open deze pagina in Safari.', 'Tik op de deelknop.', 'Kies "Zet op beginscherm".']
    : ['Open het browsermenu (de drie puntjes).', 'Kies "Installeren" of "App installeren". Zie je dat niet: "Opslaan en delen" > "Snelkoppeling maken" en vink "Openen als venster" aan.', 'Start het spel voortaan via het nieuwe pictogram.'];
  const el = h(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Gebruiken als app"><div>
    <h3>Gebruiken als app</h3><ol style="margin:4px 18px 0;padding-left:22px;line-height:1.5">${steps.map((t) => `<li style="margin:6px 0">${esc(t)}</li>`).join('')}</ol>
    <p class="note">Alles draait op dit apparaat: je spelbestanden en opgeslagen spellen blijven bewaard en het spel werkt ook zonder internet.</p>
    <div class="stack" style="padding:8px 18px 0"><button class="btn alt wide" data-close>Sluiten</button></div></div></div>`).firstChild;
  el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) el.remove(); });
  document.body.appendChild(el);
}

(async function init() {
  let files = null;
  try { files = await dbGet('files', 'game'); } catch (e) { files = null; }
  try { if (files) await bootEngine(files); else showSetup(); }
  catch (e) { failed('Starting failed', e, () => location.reload()); }
})();
</script>
